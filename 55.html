<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎂 عيد ميلاد مدحت</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(145deg, #4a0000, #8b0000, #cc0000);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            direction: rtl;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 50%, rgba(255, 50, 50, 0.3), transparent 60%),
                radial-gradient(circle at 80% 50%, rgba(255, 0, 0, 0.2), transparent 60%),
                radial-gradient(circle at 50% 80%, rgba(255, 200, 0, 0.1), transparent 50%);
            pointer-events: none;
            z-index: 0;
            animation: glowPulse 4s ease-in-out infinite;
        }
        @keyframes glowPulse {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; }
        }
        .balloon {
            position: fixed;
            font-size: 2.5rem;
            animation: floatBalloon 8s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
            opacity: 0.6;
        }
        @keyframes floatBalloon {
            0% { transform: translateY(100vh) rotate(0deg) scale(0.5); opacity: 0; }
            10% { opacity: 0.7; }
            90% { opacity: 0.7; }
            100% { transform: translateY(-10vh) rotate(20deg) scale(1.2); opacity: 0; }
        }
        .card {
            position: relative;
            z-index: 1;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(15px);
            border: 2px solid rgba(255, 200, 200, 0.25);
            border-radius: 60px 60px 40px 40px;
            padding: 50px 40px;
            max-width: 750px;
            width: 100%;
            text-align: center;
            box-shadow: 0 30px 80px rgba(255, 0, 0, 0.4), inset 0 0 80px rgba(255, 0, 0, 0.1);
            transition: 0.3s;
        }
        h1 {
            color: #ffd700;
            font-size: 2.8rem;
            margin-bottom: 5px;
            letter-spacing: 1px;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
            animation: titleGlow 2s ease-in-out infinite;
        }
        @keyframes titleGlow {
            0%, 100% { text-shadow: 0 0 30px rgba(255, 215, 0, 0.3); }
            50% { text-shadow: 0 0 60px rgba(255, 215, 0, 0.6), 0 0 120px rgba(255, 215, 0, 0.2); }
        }
        .sub {
            color: #ffb3b3;
            font-size: 1.3rem;
            margin-bottom: 30px;
            border-bottom: 1px dashed rgba(255, 100, 100, 0.4);
            padding-bottom: 15px;
        }
        .name {
            color: #ff6b6b;
            font-weight: bold;
            text-shadow: 0 0 20px rgba(255, 50, 50, 0.5);
        }
        .timer-box {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin: 30px 0 25px;
        }
        .time-item {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 30px;
            padding: 15px 18px;
            min-width: 90px;
            border: 1px solid rgba(255, 100, 100, 0.2);
            box-shadow: inset 0 0 30px rgba(255, 0, 0, 0.15), 0 10px 30px rgba(0,0,0,0.3);
            transition: transform 0.3s;
        }
        .time-item:hover {
            transform: scale(1.05);
        }
        .number {
            font-size: 3.4rem;
            font-weight: 800;
            color: #ffd700;
            line-height: 1.2;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
        }
        .label {
            font-size: 0.9rem;
            color: #ff9999;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 5px;
        }
        .message {
            background: rgba(255, 0, 0, 0.15);
            padding: 14px 20px;
            border-radius: 50px;
            color: #ffd700;
            font-size: 1.2rem;
            border-left: 4px solid #ffd700;
            margin-top: 15px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 215, 0, 0.2);
        }
        .emoji-big {
            font-size: 3.5rem;
            display: block;
            margin-bottom: 10px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.1) rotate(5deg); }
        }
        .footer {
            margin-top: 25px;
            color: #ff6666;
            font-size: 0.8rem;
        }
        .music-player {
            margin: 20px 0 10px;
            padding: 18px 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 60px;
            border: 1px solid rgba(255, 200, 200, 0.15);
        }
        .music-player audio {
            width: 100%;
            max-width: 400px;
            border-radius: 30px;
            outline: none;
            background: rgba(0,0,0,0.3);
        }
        .music-player audio::-webkit-media-controls-panel {
            background: rgba(30, 0, 0, 0.8);
        }
        .music-player audio::-webkit-media-controls-play-button {
            background-color: #ff4444;
            border-radius: 50%;
        }
        .music-label {
            color: #ffb3b3;
            font-size: 1rem;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .music-label span {
            color: #ffd700;
        }
        .music-label .artist {
            color: #ff9999;
            font-size: 0.85rem;
        }
        @media (max-width: 480px) {
            .card { padding: 30px 15px; }
            h1 { font-size: 2rem; }
            .number { font-size: 2.5rem; }
            .time-item { min-width: 70px; padding: 10px; }
            .balloon { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

<!-- بالونات متطايرة -->
<div class="balloon" style="left: 5%; animation-delay: 0s;">🎈</div>
<div class="balloon" style="left: 15%; animation-delay: 1.5s;">🎈</div>
<div class="balloon" style="left: 25%; animation-delay: 3s;">🎈</div>
<div class="balloon" style="left: 35%; animation-delay: 0.8s;">🎈</div>
<div class="balloon" style="left: 45%; animation-delay: 2.2s;">🎈</div>
<div class="balloon" style="left: 55%; animation-delay: 4s;">🎈</div>
<div class="balloon" style="left: 65%; animation-delay: 1s;">🎈</div>
<div class="balloon" style="left: 75%; animation-delay: 3.5s;">🎈</div>
<div class="balloon" style="left: 85%; animation-delay: 2s;">🎈</div>
<div class="balloon" style="left: 95%; animation-delay: 0.5s;">🎈</div>

<div class="card">
    <span class="emoji-big">🎉🥳🎂</span>
    <h1>⏳ عيد ميلاد مدحت</h1>
    <div class="sub">
        باقي على عيد ميلاد <span class="name" id="friendName">مدحت</span> 🎈
    </div>

    <div class="timer-box">
        <div class="time-item">
            <span class="number" id="days">00</span>
            <span class="label">يوم</span>
        </div>
        <div class="time-item">
            <span class="number" id="hours">00</span>
            <span class="label">ساعة</span>
        </div>
        <div class="time-item">
            <span class="number" id="minutes">00</span>
            <span class="label">دقيقة</span>
        </div>
        <div class="time-item">
            <span class="number" id="seconds">00</span>
            <span class="label">ثانية</span>
        </div>
    </div>

    <!-- مشغل الموسيقى -->
    <div class="music-player">
        <div class="music-label">
            🎵 <span>كل سنة وأنت طيب</span> 🎵
            <span class="artist">— محمود العسيلي</span>
            <span style="font-size: 0.8rem; color: #ff6666;">❤️</span>
        </div>
        <audio controls autoplay loop>
            <source src="file:///C:/Users/Medhat/Downloads/Mahmoud%20El%20Esseily%20-Kol%20Sana%20-%20Wadi%20Degla%20Ramadan%202025%20%D9%85%D8%AD%D9%85%D9%88%D8%AF%20%D8%A7%D9%84%D8%B9%D8%B3%D9%8A%D9%84%D9%8A%20-%20%D9%83%D9%84%20%D8%B3%D9%86%D8%A9%20-%20%D9%88%D8%A7%D8%AF%D9%8A%20%D8%AF%D8%AC%D9%84%D8%A9%20%D8%B1%D9%85%D8%B6%D8%A7%D9%86.mp3" type="audio/mpeg">
            متصفحك لا يدعم تشغيل الصوت 😅
        </audio>
        <div style="color: #ff8888; font-size: 0.75rem; margin-top: 8px;">
            🔁 تشغيل تلقائي • 🎧 استمتع يا مدحت
        </div>
    </div>

    <div class="message" id="statusMessage">
        ✨ مستني اليوم الكبير يا مدحت ✨
    </div>
    <div class="footer">
        🕒 التحديث كل ثانية • 🎂 التاريخ: 27 أغسطس 2026
    </div>
</div>

<script>
    (function() {
        // ************ التاريخ ************
        const BIRTHDAY = new Date('August 27, 2026 00:00:00').getTime();
        const FRIEND_NAME = 'مدحت';
        // ********************************

        document.getElementById('friendName').textContent = FRIEND_NAME;

        const daysEl = document.getElementById('days');
        const hoursEl = document.getElementById('hours');
        const minutesEl = document.getElementById('minutes');
        const secondsEl = document.getElementById('seconds');
        const messageEl = document.getElementById('statusMessage');

        function padZero(num) {
            return String(num).padStart(2, '0');
        }

        function updateCounter() {
            const now = Date.now();
            let diff = BIRTHDAY - now;

            if (diff <= 0) {
                daysEl.textContent = '🎂';
                hoursEl.textContent = '🎉';
                minutesEl.textContent = '🎈';
                secondsEl.textContent = '🥳';
                messageEl.innerHTML = `🎊 النهاردة عيد ميلاد <strong>${FRIEND_NAME}</strong>! كل سنة وأنت طيب يا غالي ❤️🎂`;
                return;
            }

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            diff -= days * (1000 * 60 * 60 * 24);
            const hours = Math.floor(diff / (1000 * 60 * 60));
            diff -= hours * (1000 * 60 * 60);
            const minutes = Math.floor(diff / (1000 * 60));
            diff -= minutes * (1000 * 60);
            const seconds = Math.floor(diff / 1000);

            daysEl.textContent = padZero(days);
            hoursEl.textContent = padZero(hours);
            minutesEl.textContent = padZero(minutes);
            secondsEl.textContent = padZero(seconds);

            // رسائل مخصصة
            if (days === 0 && hours < 1) {
                messageEl.innerHTML = `⏰ أقل من ساعة يا <strong>${FRIEND_NAME}</strong>! جهز نفسك 🎁🔥`;
            } else if (days < 7) {
                messageEl.innerHTML = `📅 باقي أقل من أسبوع! جهز الهدية يا <strong>${FRIEND_NAME}</strong> 🎁`;
            } else if (days < 30) {
                messageEl.innerHTML = `🗓️ الشهر الجاي هتحتفل بيه... متأكد من الهدية يا <strong>${FRIEND_NAME}</strong>؟ 😉`;
            } else {
                messageEl.innerHTML = `✨ مستني اليوم الكبير يا <strong>${FRIEND_NAME}</strong> ✨`;
            }
        }

        updateCounter();
        setInterval(updateCounter, 1000);

        // تشغيل الصوت تلقائياً
        window.addEventListener('load', function() {
            const audio = document.querySelector('audio');
            if (audio) {
                audio.play().catch(function(e) {
                    console.log('التشغيل التلقائي ممنوع، اضغط على Play');
                });
            }
        });
    })();
</script>

</body>
</html>
